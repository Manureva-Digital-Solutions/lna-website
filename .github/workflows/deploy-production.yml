name: Deploy vitrine production

# release is the ONLY branch that may reach lnaflow.com, and only by a deliberate
# fast-forward from develop. The `production` GitHub Environment has required
# reviewers = Gilbert, so this job holds until he approves it. Do not add a
# schedule to this workflow, and do not deploy on a Friday.
on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: deploy-vitrine-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci-gate:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run build

  deploy:
    name: Deploy to lnaflow.com
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull, build and reload on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:/usr/local/bin:$PATH"
            if [ -f "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
            fi
            cd "${{ vars.DEPLOY_PATH }}"
            ./scripts/deploy-vitrine.sh "origin/release"
