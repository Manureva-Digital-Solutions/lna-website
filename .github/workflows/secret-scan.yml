name: Secret scanning (gitleaks)

# Full-history secret scan on every push and PR. Same shape as the LNA app repo's
# scanner (pinned binary, --redact, full fetch) because a shallow clone and a
# floating tag are the two ways this class of check silently stops working.
#
# Deliberately NOT wired into either deploy workflow: a scanner outage must not
# block a deploy, and a failed deploy must not hide a leak.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 — a secret removed from the tree still lives in history.
          # A shallow clone would miss it entirely.
          fetch-depth: 0

      - name: Install gitleaks (pinned release binary)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history
        run: |
          set -euo pipefail
          # --redact keeps matched values out of CI logs; findings are still counted
          # and the job still fails. No --no-git: scanning commits is the point.
          # No .gitleaks.toml yet — default ruleset only, so nothing is silently
          # allowlisted. Add one (narrow, each entry citing a real finding) only if
          # the default ruleset produces false positives here.
          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
