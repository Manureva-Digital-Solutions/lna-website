name: CI

# Branch model: feature branches -> develop (integration, auto-deploys to
# staging.lnaflow.com) -> release (fast-forwarded from develop only, deploys to
# lnaflow.com behind the `production` Environment's required reviewer).
# `main` is kept as a mirror for old links; nothing deploys from it.
on:
  push:
    branches: [develop, release, main]
  pull_request:
    branches: [develop, release, main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  shell-tests:
    name: Deploy script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy lib tests
        run: bash scripts/test-deploy-vitrine-lib.sh

      - name: Rotation script tests (offline, stubbed)
        run: bash scripts/test-rotate-staging-basic-auth.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, shell-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Note: Vercel integration can be added later via the Vercel GitHub App.
      # Once connected, Vercel will automatically create preview deploys for PRs
      # and production deploys on merge to main. No workflow changes needed —
      # Vercel handles deployment separately from this CI pipeline.
